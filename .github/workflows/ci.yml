name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for MinVer to compute version from tags
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Generate graph
        uses: Tsabo/nugraph-action@master
        with:
          project-path: ./Source/Tsabo.Data.Schema.slnx
          job-summary: 'true'
          dotnet-version: '10.0.x'
          hide-empty-graphs: 'true'
          title: ''
        
      - name: Restore
        run: dotnet restore Source/Tsabo.Data.Schema.slnx

      - name: Build
        run: dotnet build Source/Tsabo.Data.Schema.slnx --no-restore --configuration Release

      - name: Test (SQLite)
        run: dotnet run --project Source/tests/Tsabo.Tests.Unit.Schema.Sqlite/Tsabo.Tests.Unit.Schema.Sqlite.csproj --no-build --configuration Release

      - name: Test (PostgreSQL)
        run: dotnet run --project Source/tests/Tsabo.Tests.Unit.Schema.Postgres/Tsabo.Tests.Unit.Schema.Postgres.csproj --no-build --configuration Release

      - name: Test (SQL Server)
        run: dotnet run --project Source/tests/Tsabo.Tests.Unit.Schema.SqlServer/Tsabo.Tests.Unit.Schema.SqlServer.csproj --no-build --configuration Release

      - name: Publish AOT sample
        run: dotnet publish Source/samples/Tsabo.Data.Schema.AotSample/Tsabo.Data.Schema.AotSample.csproj --configuration Release --runtime linux-x64

      - name: Run AOT sample
        run: Source/samples/Tsabo.Data.Schema.AotSample/bin/Release/net10.0/linux-x64/publish/Tsabo.Data.Schema.AotSample
