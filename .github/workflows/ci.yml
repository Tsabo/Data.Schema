name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for MinVer to compute version from tags
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Source/Tsabo.Data.Schema.slnx

      - name: Build
        run: dotnet build Source/Tsabo.Data.Schema.slnx --no-restore --configuration Release

      - name: Test (SQLite)
        run: dotnet run --project Source/tests/Tsabo.Tests.Unit.Schema.Sqlite/Tsabo.Tests.Unit.Schema.Sqlite.csproj --no-build --configuration Release

      - name: Test (PostgreSQL)
        run: dotnet run --project Source/tests/Tsabo.Tests.Unit.Schema.Postgres/Tsabo.Tests.Unit.Schema.Postgres.csproj --no-build --configuration Release

      - name: Test (SQL Server)
        run: dotnet run --project Source/tests/Tsabo.Tests.Unit.Schema.SqlServer/Tsabo.Tests.Unit.Schema.SqlServer.csproj --no-build --configuration Release
