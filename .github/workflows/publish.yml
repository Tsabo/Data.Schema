name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    name: Pack & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for MinVer to compute version from tags
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Source/Tsabo.Data.Schema.slnx

      - name: Build
        run: dotnet build Source/Tsabo.Data.Schema.slnx --no-restore --configuration Release

      - name: Test (SQLite)
        run: dotnet run --project Source/tests/Tsabo.Tests.Unit.Schema.Sqlite/Tsabo.Tests.Unit.Schema.Sqlite.csproj --no-build --configuration Release

      - name: Test (PostgreSQL)
        run: dotnet run --project Source/tests/Tsabo.Tests.Unit.Schema.Postgres/Tsabo.Tests.Unit.Schema.Postgres.csproj --no-build --configuration Release

      - name: Test (SQL Server)
        run: dotnet run --project Source/tests/Tsabo.Tests.Unit.Schema.SqlServer/Tsabo.Tests.Unit.Schema.SqlServer.csproj --no-build --configuration Release

      - name: Test Integration (PostgreSQL)
        run: dotnet run --project Source/tests/Tsabo.Tests.Integration.Schema.Postgres/Tsabo.Tests.Integration.Schema.Postgres.csproj --no-build --configuration Release

      - name: Test Integration (SQL Server)
        run: dotnet run --project Source/tests/Tsabo.Tests.Integration.Schema.SqlServer/Tsabo.Tests.Integration.Schema.SqlServer.csproj --no-build --configuration Release

      - name: Pack
        run: dotnet pack Source/Tsabo.Data.Schema.slnx --no-build --configuration Release --output ./nupkgs

      - name: Push to NuGet.org
        run: dotnet nuget push ./nupkgs/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
